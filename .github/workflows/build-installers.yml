name: Build Desktop Installers

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release'
        required: false
        default: '1.0.0'

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Package macOS DMG
        run: ./gradlew packageDmg --no-daemon

      - name: List build artifacts
        run: ls -la build/compose/binaries/main/dmg/

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: RATS-macOS-DMG
          path: build/compose/binaries/main/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Package Windows MSI
        run: ./gradlew packageMsi --no-daemon

      - name: List build artifacts
        run: dir build\compose\binaries\main\msi\

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: RATS-Windows-MSI
          path: build/compose/binaries/main/msi/*.msi
          retention-days: 30
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: RATS-macOS-DMG
          path: ./release-artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: RATS-Windows-MSI
          path: ./release-artifacts/windows

      - name: List downloaded artifacts
        run: |
          echo "macOS artifacts:"
          ls -la ./release-artifacts/macos/
          echo "Windows artifacts:"
          ls -la ./release-artifacts/windows/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release-artifacts/macos/*.dmg
            ./release-artifacts/windows/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
